services:
  content-service:
    image: adebayoyeleye/story-content-service:${CONTENT_IMAGE_TAG}
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/api/v1/auth/.well-known/jwks.json
      SERVER_PORT: ${CONTENT_SERVER_PORT}
      SPRING_MONGODB_URI: ${CONTENT_MONGODB_URI}
    restart: always
    depends_on:
      - auth-service
    # OPTIONAL: readiness (see section 2)
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 20

  auth-service:
    image: adebayoyeleye/auth-service:${AUTH_IMAGE_TAG}
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${AUTH_SERVER_PORT}
      SPRING_MONGODB_URI: ${AUTH_MONGODB_URI}
    restart: always
    # OPTIONAL: readiness (see section 2)
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 20

  frontend:
    image: adebayoyeleye/story-frontend:${FRONTEND_IMAGE_TAG}
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # IMPORTANT: map your host cert folder into the container
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - content-service
      - auth-service
      - frontend
    restart: always
