# --- HTTP -> HTTPS redirect ---
server {
    listen 80;
    server_name arokoverse.com www.arokoverse.com;

    return 301 https://$host$request_uri;
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    server_name arokoverse.com www.arokoverse.com;

    ssl_certificate     /etc/nginx/ssl/arokoverse.com.pem;
    ssl_certificate_key /etc/nginx/ssl/arokoverse.com.key;

    # Reasonable TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (safe defaults)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # (Optional) upload size
    client_max_body_size 20m;

    # --- CONTENT docs + actuator ---
    location /content/swagger-ui/ {
        proxy_pass http://content-service:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /content/v3/api-docs {
        proxy_pass http://content-service:8080/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /content/actuator/ {
        proxy_pass http://content-service:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- AUTH docs + actuator ---
    location /auth/swagger-ui/ {
        proxy_pass http://auth-service:8081/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /auth/v3/api-docs {
        proxy_pass http://auth-service:8081/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /auth/actuator/ {
        proxy_pass http://auth-service:8081/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Auth Service (versioned, namespaced)
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8081; # no trailing slash
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Content Service (versioned, namespaced)
    location /api/v1/content/ {
        proxy_pass http://content-service:8080; # no trailing slash
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # NO try_files here! 
        # This Nginx just passes the request to the frontend container's Nginx.

        # Add these to handle larger JS files without buffering to disk
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }
}
